# Temporary: runs the Recent tests on a real Windows machine. This branch is deleted after the probe.
# The public cut clears this file each time: copy it back to .github/workflows/ after every cut.
name: probe Recent on Windows

on:
  push:
    branches: ["s57-windows-probe"]

permissions:
  contents: read

jobs:
  recent_windows:
    name: Recent tests (windows)
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials==6.12.0" "python-docx==1.2.0" "python-pptx==1.0.2" "lxml==6.1.3" "pillow==13.0.0" "typing_extensions==4.16.0" "xlsxwriter==3.3.1" pytest
      - name: Windows version
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())" | tee out-version.txt
      - name: Fixed code, collector as shipped, pass A
        if: always()
        timeout-minutes: 8
        run: python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --deselect "tests/test_s54_stage5_find.py::test_r26_hundred_mixed_metadata_only_and_legacy" tests/test_s54_stage5_find.py tests/test_s59_collector.py 2>&1 | tee out-fixed-a.txt
      - name: Fixed code, collector as shipped, pass B
        if: always()
        timeout-minutes: 8
        run: python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --deselect "tests/test_s54_stage5_find.py::test_r26_hundred_mixed_metadata_only_and_legacy" tests/test_s54_stage5_find.py tests/test_s59_collector.py 2>&1 | tee out-fixed-b.txt
      - name: Fixed code, collector as shipped, pass C
        if: always()
        timeout-minutes: 8
        run: python -X faulthandler -m pytest -q --tb=short -p no:cacheprovider --deselect "tests/test_s54_stage5_find.py::test_r26_hundred_mixed_metadata_only_and_legacy" tests/test_s54_stage5_find.py tests/test_s59_collector.py 2>&1 | tee out-fixed-c.txt
      - name: Fixed code, Find times, whole file
        if: always()
        timeout-minutes: 20
        run: python -X faulthandler -m pytest -q -s --tb=short --durations=15 -p no:cacheprovider -p probe_settle tests/test_s54_stage5_find.py 2>&1 | tee out-fixed-time.txt
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-outputs
          path: out-*.txt
