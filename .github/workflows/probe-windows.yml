# Temporary: runs the Recent tests on a real Windows machine. This branch is deleted after the probe.
# The public cut clears this file each time: copy it back to .github/workflows/ after every cut.
name: probe Recent on Windows

on:
  push:
    branches: ["s57-windows-probe"]

permissions:
  contents: read

jobs:
  recent_windows:
    name: Recent tests (windows)
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials==6.12.0" "python-docx==1.2.0" "python-pptx==1.0.2" "lxml==6.1.3" "pillow==13.0.0" "typing_extensions==4.16.0" "xlsxwriter==3.3.1" pytest
      - name: Windows version
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())" | tee out-version.txt
      - name: New Windows file
        if: always()
        timeout-minutes: 8
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s57_windows_recent.py 2>&1 | tee out-s57.txt
      - name: Stage 3 file
        if: always()
        timeout-minutes: 10
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s54_stage3_count.py 2>&1 | tee out-s54.txt
      - name: Old Recent callers
        if: always()
        timeout-minutes: 12
        run: python -m pytest -q --tb=short -x -p no:cacheprovider tests/test_s5b.py tests/test_s3b2.py tests/test_s3b3.py tests/test_s10_welcome.py 2>&1 | tee out-callers.txt
      - name: Stage 4 file
        if: always()
        timeout-minutes: 8
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s54_stage4_frame.py 2>&1 | tee out-stage4.txt
      - name: Stage 5 file
        if: always()
        timeout-minutes: 8
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s54_stage5_find.py 2>&1 | tee out-stage5.txt
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-outputs
          path: out-*.txt
