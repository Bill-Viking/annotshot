# Temporary: runs the Recent tests on a real Windows machine. This branch is deleted after the probe.
name: probe Recent on Windows

on:
  push:
    branches: ["s57-windows-probe"]

permissions:
  contents: read

jobs:
  recent_windows:
    name: Recent tests (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6-Essentials==6.12.0" "python-docx==1.2.0" "python-pptx==1.0.2" "lxml==6.1.3" "pillow==13.0.0" "typing_extensions==4.16.0" "xlsxwriter==3.3.1" pytest
      - name: Windows version
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"
      - name: New Windows file
        if: always()
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s57_windows_recent.py
      - name: Stage 3 file
        if: always()
        run: python -m pytest -q --tb=short -rs -p no:cacheprovider tests/test_s54_stage3_count.py
      - name: Stage 1 and old Recent callers
        if: always()
        run: python -m pytest -q --tb=short -p no:cacheprovider tests/test_s52_stage1_save_kept.py tests/test_s5b.py tests/test_s3b2.py tests/test_s3b3.py tests/test_s10_welcome.py
